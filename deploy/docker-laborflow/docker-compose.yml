services:
  postgres:
    image: postgres:18-alpine
    container_name: laborflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laborflow}
      POSTGRES_USER: ${POSTGRES_USER:-laborflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (run.ts generates .env with a random dev password on first start)}
    ports:
      - "5434:5432"
    volumes:
      # Mount one level up for PostgreSQL 18+ (uses pg_ctlcluster layout,
      # data lands in a version subdir, e.g. 18/docker). See docker-library/postgres#1259.
      - ./docker-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laborflow} -d ${POSTGRES_DB:-laborflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
