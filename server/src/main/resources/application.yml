server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: laborflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5434/laborflow}
    username: ${POSTGRES_USER:laborflow}
    password: ${POSTGRES_PASSWORD:laborflow123}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

laborflow:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-to-at-least-32-characters}
    expiration-minutes: 720
  wechat:
    miniapp:
      app-id: ${WECHAT_MINIAPP_APP_ID:}
      app-secret: ${WECHAT_MINIAPP_APP_SECRET:}
      code2-session-url: ${WECHAT_MINIAPP_CODE2SESSION_URL:https://api.weixin.qq.com/sns/jscode2session}
  upload-dir: ${UPLOAD_DIR:./uploads}
  file:
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:10485760}
    storage:
      type: ${FILE_STORAGE_TYPE:local}
      local:
        base-dir: ${FILE_STORAGE_LOCAL_BASE_DIR:${UPLOAD_DIR:./uploads}}
      object:
        endpoint: ${OBJECT_STORAGE_ENDPOINT:}
        bucket: ${OBJECT_STORAGE_BUCKET:}
        auth-header-name: ${OBJECT_STORAGE_AUTH_HEADER_NAME:Authorization}
        auth-header-value: ${OBJECT_STORAGE_AUTH_HEADER_VALUE:}
