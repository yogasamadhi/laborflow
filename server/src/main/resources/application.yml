server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: laborflow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/laborflow}
    username: ${POSTGRES_USER:laborflow}
    password: ${POSTGRES_PASSWORD:laborflow123}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

laborflow:
  jwt:
    secret: ${JWT_SECRET:please-change-this-secret-to-at-least-32-characters}
    expiration-minutes: 720
  upload-dir: ${UPLOAD_DIR:./uploads}

