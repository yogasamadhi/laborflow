services:
  postgres:
    image: postgres:18-alpine
    container_name: laborflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laborflow}
      POSTGRES_USER: ${POSTGRES_USER:-laborflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laborflow123}
    ports:
      - "5434:5432"
    volumes:
      - ./docker-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-laborflow} -d ${POSTGRES_DB:-laborflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

