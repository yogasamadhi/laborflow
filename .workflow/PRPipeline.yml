version: '1.0'
name: pr-backend-test
displayName: PR Backend Test
triggers:
  pr:
    branches:
      include:
        - master
stages:
  - stage:
      name: backend-test
      displayName: Backend Test
      steps:
        - step: build@maven
          name: maven-test
          displayName: Maven Test
          jdkVersion: 21
          mavenVersion: 3.6.3
          commands:
            - mvn -B -ntp -f server/pom.xml test
            - mvn -B -ntp -f server/pom.xml jacoco:report
          caches:
            - ~/.m2
