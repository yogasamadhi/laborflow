version: '1.0'
name: pr-desktop-quality
displayName: PR Desktop Quality
triggers:
  pr:
    branches:
      include:
        - main
stages:
  - stage:
      name: desktop-quality
      displayName: Desktop Renderer Quality
      steps:
        - step: build@nodejs
          name: pnpm-quality
          displayName: pnpm Lint Typecheck Test Build
          nodeVersion: 22.18.0
          commands:
            - corepack enable
            - pnpm --dir clients/desktop install --frozen-lockfile
            - pnpm --dir clients/desktop lint
            - pnpm --dir clients/desktop typecheck
            - pnpm --dir clients/desktop test
            - pnpm --dir clients/desktop build:renderer
          caches:
            - ~/.pnpm-store
